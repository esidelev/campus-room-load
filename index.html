 ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];\nconst ABBR = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\nconst RAMP = ['#F3E6AE','#EFC66B','#E8A24F','#D2673C','#A83A2E','#7A2323'];\nconst ZERO = '#ECEFE9';\nconst INK = '#1B211E';\n\nconst S = {term: DATA.order[0], mode: 'session', hybrid: 'full', room: 'all', bin: 30, tent: true, sel: null};\n\n/* row layout: [course, section, group(0 in person, 1 hybrid), day, start, end,\n                roomKind(0 assigned, 1 not yet), roomLabel, tentative, wHalf, wFull] */\n\n/* ---------- helpers ---------- */\nconst t12 = (m, short) => {\n  const h = Math.floor(m / 60), mm = m % 60, ap = h < 12 ? 'AM' : 'PM', hh = h % 12 || 12;\n  return (short && mm === 0) ? hh + ' ' + ap : hh + ':' + String(mm).padStart(2, '0') + ' ' + ap;\n};\nconst clean = v => Math.round(v * 100) / 100;\nconst num = v => {\n  v = clean(v);\n  return Number.isInteger(v) ? v.toLocaleString('en-US') : v.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1});\n};\nconst plural = (n, a, b) => n === 1 ? a : b;\nconst hex = s => [1, 3, 5].map(k => parseInt(s.substr(k, 2), 16));\nfunction ramp(t) {\n  const pos = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);\n  const i = Math.min(Math.floor(pos), RAMP.length - 2), f = pos - i;\n  const a = hex(RAMP[i]), b = hex(RAMP[i + 1]);\n  return '#' + a.map((v, k) => Math.round(v + (b[k] - v) * f).toString(16).padStart(2, '0')).join('');\n}\nfunction lum(h) {\n  const c = hex(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });\n  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];\n}\nconst bg = (v, max) => v <= 0 ? ZERO : ramp(.04 + .96 * (v / max));\nconst fg = bgc => lum(bgc) < .2 ? '#FFFFFF' : INK;\n\n/* ---------- model ---------- */\nfunction weight(r) {\n  if (r[2] === 0) return 1;\n  if (S.hybrid === 'off') return 0;\n  return S.hybrid === 'full' ? r[10] : r[9];\n}\nfunction keep(r) {\n  if (r[8] && !S.tent) return false;\n  if (S.room === 'assigned' && r[6] !== 0) return false;\n  if (S.room === 'pending' && r[6] !== 1) return false;\n  return weight(r) > 0;\n}\nlet LO = 1e9, HI = 0, HIEND = 0;\nDATA.order.forEach(t => DATA.terms[t].rows.forEach(r => {\n  if (r[4] < LO) LO = r[4]; if (r[4] > HI) HI = r[4]; if (r[5] > HIEND) HIEND = r[5];\n}));\nconst SESSION = () => S.mode === 'session';          // classes running at a moment vs classes beginning\nconst BS = () => S.bin;                              // minutes per row\nconst unit = v => SESSION() ? plural(v, 'class in session', 'classes in session') : plural(v, 'class start', 'class starts');\nconst binsFor = () => {\n  const out = [], size = BS(), stop = SESSION() ? HIEND : HI + 1;\n  for (let b = Math.floor(LO / size) * size; b < stop; b += size) out.push(b);\n  return out;\n};\nfunction build(term) {\n  const bins = binsFor();\n  const cells = bins.map(() => Array.from({length: 7}, () => ({v: 0, groups: []})));\n  const first = bins[0];\n  // in session: sample every half hour first, then (for 1-hour blocks) keep the busiest half hour of each hour\n  const fine = SESSION() ? Array.from({length: Math.ceil((HIEND - first) / 30) + 1}, () => Array.from({length: 7}, () => ({v: 0, groups: []}))) : null;\n  // A class listed under several course codes (cross-listed) is one class in one room:\n  // rows that share a key are one group, counted once at the heaviest weight among them.\n  const groups = new Map();\n  DATA.terms[term].rows.forEach(r => {\n    if (!keep(r)) return;\n    let g = groups.get(r[12]);\n    if (!g) { g = {rows: [], w: 0, hy: true}; groups.set(r[12], g); }\n    g.rows.push(r);\n    const w = weight(r);\n    if (w > g.w) g.w = w;\n    if (r[2] === 0) g.hy = false;\n  });\n  groups.forEach(g => {\n    const r = g.rows[0];\n    if (!SESSION()) {\n      const c = cells[Math.floor((r[4] - first) / S.bin)][r[3]];\n      c.v += g.w; c.groups.push(g);\n    } else {\n      // in session at every half-hour mark from its start until it ends (the campus map's rule)\n      for (let t = Math.ceil(r[4] / 30) * 30; t < r[5]; t += 30) {\n        const i = (t - first) / 30;\n        if (i < 0 || i >= fine.length) continue;\n        const c = fine[i][r[3]]; c.v += g.w; c.groups.push(g);\n      }\n    }\n  });\n  if (SESSION()) {\n    const per = S.bin / 30;\n    cells.forEach((rw, i) => rw.forEach((c, d) => {\n      for (let k = 0; k < per; k++) {\n        const f = fine[i * per + k] && fine[i * per + k][d];\n        if (f && f.v > c.v) { c.v = f.v; c.groups = f.groups; }\n      }\n    }));\n  }\n  const rowTot = cells.map(rw => rw.reduce((a, c) => a + c.v, 0));\n  const dayTot = Array.from({length: 7}, (_, d) => cells.reduce((a, rw) => a + rw[d].v, 0));\n  const dayPeak = Array.from({length: 7}, (_, d) => cells.reduce((a, rw) => Math.max(a, rw[d].v), 0));\n  let max = 0, best = null;\n  cells.forEach((rw, i) => rw.forEach((c, d) => { if (c.v > max) { max = c.v; best = {i, d}; } }));\n  return {bins, cells, rowTot, dayTot, dayPeak, max, best, total: dayTot.reduce((a, b) => a + b, 0)};\n}\n\n/* ---------- controls ---------- */\nfunction seg(id, opts, key, cast) {\n  const el = document.getElementById(id);\n  opts.forEach(([val, label]) => {\n    const b = document.createElement('button');\n    b.type = 'button'; b.className = 'pill'; b.textContent = label; b.dataset.v = String(val);\n    b.addEventListener('click', () => { setState(key, cast ? cast(b.dataset.v) : val); });\n    el.append(b);\n  });\n}\nfunction setState(key, val) {\n  if (key === 'bin' && S.sel) S.sel.bin = Math.floor(S.sel.bin / val) * val;\n  S[key] = val;\n  if (key === 'term' || key === 'mode') S.sel = null;\n  draw();\n}\nfunction syncControls() {\n  const mark = (id, cur) => document.querySelectorAll('#' + id + ' .pill').forEach(b =>\n    b.setAttribute('aria-pressed', String(b.dataset.v) === String(cur)));\n  mark('mode', S.mode); mark('room', S.room); mark('bin', BS()); mark('tent', S.tent);\n  const nt = DATA.terms[S.term].rows.some(r => r[8]);\n  document.querySelectorAll('#tent .pill').forEach(b => b.disabled = !nt);\n  document.getElementById('term').value = S.term;\n}\n\n/* ---------- tooltip ---------- */\nconst tip = document.getElementById('tip');\nfunction showTip(el, model, i, d) {\n  const c = model.cells[i][d], b = model.bins[i];\n  const inP = c.groups.filter(g => !g.hy).length;\n  const hy = c.groups.filter(g => g.hy);\n  tip.replaceChildren();\n  const l1 = document.createElement('span'); l1.className = 'tl';\n  l1.textContent = ABBR[d] + ' \u00b7 ' + (SESSION() && S.bin === 30 ? t12(b) : t12(b) + '\u2013' + t12(b + S.bin));\n  const v = document.createElement('span'); v.className = 'tv';\n  v.textContent = c.v ? num(c.v) + ' ' + unit(c.v) : (SESSION() ? 'No classes in session' : 'No class starts');\n  tip.append(l1, v);\n  if (c.v) {\n    const l2 = document.createElement('span'); l2.className = 'tl';\n    const parts = [];\n    if (inP) parts.push(inP + ' in person');\n    if (hy.length) parts.push(hy.length + ' hybrid');\n    l2.textContent = parts.join(' \u00b7 ');\n    tip.append(l2);\n  }\n  tip.style.display = 'block';\n  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;\n  let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;\n  if (y < 6) y = r.bottom + 8;\n  x = Math.max(6, Math.min(x, window.innerWidth - tw - 6));\n  tip.style.left = x + 'px'; tip.style.top = y + 'px';\n}\nconst hideTip = () => { tip.style.display = 'none'; };\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });\n\n/* ---------- drawing ---------- */\nlet MODEL = null;\nfunction draw() {\n  syncControls();\n  const model = build(S.term);\n  MODEL = model;\n  let gmax = 0;\n  DATA.order.forEach(t => { gmax = Math.max(gmax, t === S.term ? model.max : build(t).max); });\n  const T = DATA.terms[S.term];\n\n  // headline\n  const inP = model.cells.reduce((a, rw) => a + rw.reduce((b, c) =>\n    b + c.groups.filter(g => !g.hy).length, 0), 0);\n  const hyW = model.cells.reduce((a, rw) => a + rw.reduce((b, c) =>\n    b + c.groups.filter(g => g.hy).reduce((s, g) => s + g.w, 0), 0), 0);\n  if (SESSION()) {\n    const bc = model.best ? model.cells[model.best.i][model.best.d] : null;\n    document.getElementById('hl').textContent = bc ? num(model.max) + ' classes at once at the peak' : '\u2014';\n    document.getElementById('hl1').textContent = bc\n      ? 'Peak: ' + ABBR[model.best.d] + ' ' + t12(model.bins[model.best.i], true) : '';\n    document.getElementById('hl2').textContent = bc\n      ? bc.groups.filter(g => !g.hy).length + ' in person'\n        + (S.hybrid === 'off' ? '' : ' + ' + num(bc.groups.filter(g => g.hy).reduce((s, g) => s + g.w, 0)) + ' from hybrid')\n      : '';\n  } else {\n    document.getElementById('hl').textContent = num(model.total) + ' class starts a week';\n    document.getElementById('hl1').textContent =\n      inP + ' in person' + (S.hybrid === 'off' ? '' : ' + ' + num(hyW) + ' from hybrid');\n    document.getElementById('hl2').textContent = model.best\n      ? 'Busiest: ' + ABBR[model.best.d] + ' ' + t12(model.bins[model.best.i], true) + ' (' + num(model.max) + ')'\n      : '';\n  }\n\n  // draft banner\n  const dn = document.getElementById('draft');\n  if (T.draft) {\n    const all = new Set(T.rows.map(r => r[12])).size;\n    const pend = new Set(T.rows.filter(r => r[6] === 1).map(r => r[12])).size;\n    dn.hidden = false;\n    dn.textContent = 'Draft schedule. ' + Math.round(pend / all * 100) + '% of these on-campus classes ('\n      + pend.toLocaleString() + ' of ' + all.toLocaleString() + ') do not have a room yet. '\n      + 'Use the Rooms filter to see only the ones that are placed, or only the ones still waiting.';\n  } else dn.hidden = true;\n\n  // titles\n  document.getElementById('mtitle').textContent =\n    (SESSION() ? 'Classes in session by day and time, ' : 'Class starts by day and time, ') + S.term;\n  const hyTxt = 'Hybrid counts in full.';\n  const rmTxt = S.room === 'all' ? 'All on-campus rooms.' : S.room === 'assigned' ? 'Only sections with a room.' : 'Only sections still waiting for a room.';\n  document.getElementById('msub').textContent =\n    (SESSION() ? (S.bin === 60 ? 'Each cell is the most classes running at once in that hour (its busiest half hour). ' : 'Each cell is how many classes are running at that time. ') : 'Each cell is how many classes begin in that block. ')\n    + hyTxt + ' ' + rmTxt + ' Click a cell to see its classes.';\n\n  // matrix\n  const wrap = document.getElementById('mapwrap');\n  wrap.replaceChildren();\n  if (!model.total) {\n    const e = document.createElement('div'); e.className = 'empty';\n    const b = document.createElement('b'); b.textContent = 'Nothing matches these settings';\n    const p = document.createElement('span');\n    p.textContent = (S.room === 'pending' && !T.rows.some(r => r[6] === 1))\n      ? 'Every ' + S.term + ' section already has a room. Switch Rooms to All or Assigned.'\n      : 'Try switching Rooms to All.';\n    e.append(b, p); wrap.append(e);\n    document.getElementById('legend').replaceChildren();\n    renderDetail(model);\n    return;\n  }\n\n  const tbl = document.createElement('table'); tbl.className = 'hm';\n  tbl.setAttribute('aria-label', (SESSION() ? 'Classes in session' : 'Class starts') + ' by day of week and time, ' + S.term);\n  const cg = document.createElement('colgroup');\n  const c0 = document.createElement('col'); c0.className = 'c-time'; cg.append(c0);\n  for (let d = 0; d < 7; d++) cg.append(document.createElement('col'));\n  if (!SESSION()) { const cl = document.createElement('col'); cl.className = 'c-tot'; cg.append(cl); }\n  tbl.append(cg);\n\n  const thead = document.createElement('thead'), hr = document.createElement('tr');\n  const corner = document.createElement('th'); corner.textContent = SESSION() ? 'Time' : 'Start'; corner.style.textAlign = 'right';\n  corner.style.paddingRight = '8px'; hr.append(corner);\n  ABBR.forEach((a, d) => { const th = document.createElement('th'); th.scope = 'col'; th.textContent = a; th.title = DAYS[d]; hr.append(th); });\n  if (!SESSION()) { const wk = document.createElement('th'); wk.textContent = 'Week'; hr.append(wk); }\n  thead.append(hr); tbl.append(thead);\n\n  const tb = document.createElement('tbody');\n  model.bins.forEach((b, i) => {\n    const tr = document.createElement('tr');\n    const th = document.createElement('th'); th.scope = 'row'; th.className = 'rowh';\n    th.textContent = t12(b, S.bin === 60); tr.append(th);\n    for (let d = 0; d < 7; d++) {\n      const c = model.cells[i][d], td = document.createElement('td');\n      const btn = document.createElement('button');\n      btn.type = 'button'; btn.className = 'cell';\n      const col = bg(c.v, gmax);\n      btn.style.background = col; btn.style.color = fg(col);\n      btn.textContent = c.v ? num(c.v) : '';\n      btn.setAttribute('aria-label', DAYS[d] + ' ' + t12(b) + ': ' + (c.v ? num(c.v) + ' ' + unit(c.v) : 'none'));\n      const on = !!(S.sel && S.sel.bin === b && S.sel.d === d);\n      btn.setAttribute('aria-pressed', on ? 'true' : 'false');\n      btn.tabIndex = on ? 0 : -1;               // one tab stop; arrow keys move between cells\n      btn.dataset.i = i; btn.dataset.d = d;\n      btn.addEventListener('click', () => { S.sel = {bin: b, d}; S.refocus = true; draw(); });\n      btn.addEventListener('pointerenter', () => showTip(btn, model, i, d));\n      btn.addEventListener('pointerleave', hideTip);\n      btn.addEventListener('focus', () => showTip(btn, model, i, d));\n      btn.addEventListener('blur', hideTip);\n      td.append(btn); tr.append(td);\n    }\n    if (!SESSION()) {\n      const tt = document.createElement('td'); tt.className = 'tot';\n      tt.textContent = model.rowTot[i] ? num(model.rowTot[i]) : ''; tr.append(tt);\n    }\n    tb.append(tr);\n  });\n  tb.addEventListener('keydown', e => {\n    const k = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]}[e.key];\n    const cur = document.activeElement;\n    if (!k || !cur || !cur.classList.contains('cell')) return;\n    const ni = +cur.dataset.i + k[0], nd = +cur.dataset.d + k[1];\n    const row = tb.children[ni];\n    if (!row || nd < 0 || nd > 6) return;\n    e.preventDefault();\n    row.children[nd + 1].firstChild.focus();\n  });\n  tbl.append(tb);\n\n  const tf = document.createElement('tfoot'), fr = document.createElement('tr');\n  const fl = document.createElement('th'); fl.className = 'rowh'; fl.scope = 'row';\n  fl.textContent = SESSION() ? 'Day peak' : 'Day total'; fr.append(fl);\n  (SESSION() ? model.dayPeak : model.dayTot).forEach(v => {\n    const td = document.createElement('td'); td.className = 'dtot'; td.textContent = v ? num(v) : '\u2013'; fr.append(td);\n  });\n  if (!SESSION()) { const gt = document.createElement('td'); gt.className = 'dtot'; gt.textContent = num(model.total); fr.append(gt); }\n  tf.append(fr); tbl.append(tf);\n  wrap.append(tbl);\n\n  // legend: the scale is shared across terms so flipping between them is a fair comparison\n  const lg = document.getElementById('legend'); lg.replaceChildren();\n  const l0 = document.createElement('span'); l0.textContent = '0';\n  const bar = document.createElement('span'); bar.className = 'bar';\n  const stops = []; for (let k = 0; k <= 10; k++) stops.push(ramp(.04 + .96 * k / 10));\n  bar.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';\n  const l1 = document.createElement('span'); l1.textContent = num(gmax) + (SESSION() ? ' classes in session' : ' class starts');\n  const l2 = document.createElement('span'); l2.textContent = '\u00b7 same scale for every term';\n  lg.append(l0, bar, l1, l2);\n\n  if (!S.sel && model.best) S.sel = {bin: model.bins[model.best.i], d: model.best.d};\n  renderDetail(model);\n  if (S.sel) {\n    const i = model.bins.indexOf(S.sel.bin);\n    document.querySelectorAll('.cell').forEach(el => { el.setAttribute('aria-pressed', 'false'); el.tabIndex = -1; });\n    const rows = tb.children;\n    if (i >= 0 && rows[i]) {\n      const el = rows[i].children[S.sel.d + 1].firstChild;\n      el.setAttribute('aria-pressed', 'true'); el.tabIndex = 0;\n      if (S.refocus) el.focus({preventScroll: true});   // the table is rebuilt on every change\n    }\n    S.refocus = false;\n  }\n  renderFoot();\n}\n\nfunction renderDetail(model) {\n  const title = document.getElementById('dtitle'), sum = document.getElementById('dsum');\n  const list = document.getElementById('dlist'); list.replaceChildren();\n  if (!S.sel) { title.textContent = 'Pick a cell'; sum.textContent = 'Click a cell to see which classes are meeting then.'; return; }\n  const i = model.bins.indexOf(S.sel.bin);\n  if (i < 0) { S.sel = null; return renderDetail(model); }\n  const c = model.cells[i][S.sel.d], b = S.sel.bin;\n  title.textContent = DAYS[S.sel.d] + ', ' + (SESSION() && S.bin === 30 ? t12(b) : t12(b) + '\u2013' + t12(b + S.bin));\n  if (!c.groups.length) { sum.textContent = SESSION() ? 'No classes in session in this block with the current settings.' : 'No class starts in this block with the current settings.'; return; }\n  const nIn = c.groups.filter(g => !g.hy).length, nHy = c.groups.length - nIn;\n  sum.textContent = num(c.v) + ' ' + unit(c.v) + ': ' + nIn + ' in person'\n    + (nHy ? ', ' + nHy + ' hybrid' : '') + '.';\n  const label = g => g.rows.map(r => r[0] + ' \u00b7 ' + r[1]).join(' / ');\n  c.groups.slice().sort((x, y) => label(x).localeCompare(label(y), undefined, {numeric: true})).forEach(g => {\n    const r = g.rows[0];\n    const it = document.createElement('div'); it.className = 'item';\n    const nm = document.createElement('div'); nm.className = 'iname';\n    nm.textContent = label(g);\n    if (g.rows.length > 1) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'cross-listed'; nm.append(t); }\n    if (g.rows.every(x => x[8])) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'tentative'; nm.append(t); }\n    const mt = document.createElement('div'); mt.className = 'imeta';\n    let kind = 'In person';\n    if (g.hy) {\n      kind = 'Hybrid';\n    }\n    const parts = [kind, t12(r[4]) + '\u2013' + t12(r[5]), r[6] === 0 ? r[7] : 'room not assigned yet'];\n    mt.textContent = parts.join(' \u00b7 ');\n    it.append(nm, mt); list.append(it);\n  });\n}\n\nfunction renderFoot() {\n  const T = DATA.terms[S.term], s = T.summary.skipped, f = document.getElementById('foot');\n  f.replaceChildren();\n  const add = (bold, text) => {\n    const p = document.createElement('p');\n    if (bold) { const b = document.createElement('b'); b.textContent = bold + ' '; p.append(b); }\n    p.append(document.createTextNode(text)); f.append(p);\n  };\n  const n = k => (s[k] || 0).toLocaleString();\n  add('How this is counted.', (SESSION()\n      ? 'Every class counts at each half-hour mark from its start to its end, on each day it meets, so a 2:00\u20133:15 class shows at 2:00, 2:30 and 3:00. '\n        + 'That is the same count as the campus room-load map, which shows rooms in use at a moment. '\n        + 'With 1-hour blocks, each cell shows its busiest half hour. '\n      : 'Every class counts once, at the moment it starts, on each day it meets. ')\n    + 'In-person and hybrid sections both count 1 on every day they meet on campus; online meetings inside hybrid sections are left out.');\n  const mr = T.summary.merged_by_room || 0, mi = T.summary.merged_by_instructor || 0;\n  add('Cross-listed classes count once.', 'One class is often listed under several course codes. Sections that share a room and a time are one class, '\n    + 'so they count once (' + mr.toLocaleString() + ' extra listings merged in ' + S.term + ').'\n    + (mi ? ' Where no room is assigned yet, sections taught by the same instructor at the same time are treated the same way ('\n      + mi.toLocaleString() + ' merged). Cross-listed sections with different instructors cannot be recognized until they get a room, '\n      + 'so the draft may still run slightly high.' : ''));\n  add('Left out of ' + S.term + '.', n('online sections') + ' fully online sections; '\n    + n('no usable day/time') + ' in-person or hybrid sections that have no day or time yet; '\n    + n('off-campus / see-notes meetings') + ' off-campus or \u201csee notes\u201d meetings; '\n    + n('online meetings inside hybrid sections') + ' online meetings inside hybrid sections; '\n    + n('winter-session sections') + ' winter-session and ' + n('cancelled sections') + ' cancelled sections.');\n  add('Rooms.', '\u201cNot yet assigned\u201d means the room field is blank or TBA. Tentative sections are included unless you turn them off.');\n}\nfunction hybridMixed(T) {\n  const seen = new Set();\n  T.rows.forEach(r => { if (r[2] === 1 && r[9] !== 0.5) seen.add(r[0] + '|' + r[1]); });\n  return seen.size;\n}\n\n/* ---------- init ---------- */\nconst termSel = document.getElementById('term');\nDATA.order.forEach(t => {\n  const o = document.createElement('option'); o.value = t;\n  o.textContent = t + (DATA.terms[t].draft ? ' (draft)' : '');\n  termSel.append(o);\n});\ntermSel.addEventListener('change', e => setState('term', e.target.value));\nseg('mode', [['session', 'In session'], ['starts', 'Starting']], 'mode');\nseg('room', [['all', 'All'], ['assigned', 'Assigned'], ['pending', 'Not yet assigned']], 'room');\nseg('bin', [[30, '30 min'], [60, '1 hour']], 'bin', Number);\nseg('tent', [[true, 'Include'], [false, 'Exclude']], 'tent', v => v === 'true');\ndraw();\n<\/script>\n<\/body>\n<\/html>\n"};
const loaded = {};
function show(which, push) {
  for (const k of Object.keys(PAGES)) {
    const f = document.getElementById('f-' + k), t = document.getElementById('t-' + k), on = k === which;
    f.hidden = !on; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
    if (on && !loaded[k]) { f.srcdoc = PAGES[k]; loaded[k] = true; }   // load a view the first time it is opened
  }

}
